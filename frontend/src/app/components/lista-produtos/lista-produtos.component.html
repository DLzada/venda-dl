<div class="vitrine-container">
  <h2> Vitrine de Produtos - Venda DL</h2>
  
  <div class="grid-produtos">
    <div *ngFor="let produto of produtos" class="card-produto" style="border: 1px solid #ccc; margin: 10px; padding: 10px;">
      <h3>{{ produto.nome }}</h3>
      <p>{{ produto.descricao }}</p>
      <p>R$ {{ produto.preco }}</p>
      <button (click)="comprarProduto(produto)">Adicionar ao Carrinho</button>
    </div> 
  </div>
</div>
