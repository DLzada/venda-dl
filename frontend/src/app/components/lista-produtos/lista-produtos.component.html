<div class="vitrine-container">
    <h2>Vitrine de Produtos - Venda DL</h2>

    <div class="grid-produtos">
        <div *ngFor="let produto of produtos" class="card-produtos">
            <h3>{{produto.nome}}</h3>
            <p class="descricao">{{ produto.descricao }}</p>

            <!-- Exibindo a categoria vinda do relacionamento tipado -->
            <span class="badge-categoria">{{ produto.categoria.nome }}</span>

            <p class="preco">R$ {{ produto.preco | number:'1.2-2' }}</p>

            <!-- Captura o evento de clique e chama o método do TypeScript -->
            <button (click)="comprarProduto(produto)">Adicionar ao Carrinho</button>
        </div>
    </div>
</div>
